# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: wemadeit
description: Conditional group pots on Monad — created, committed, tilted, refunded.
# Three factory generations, three PotCreated shapes (topic0 = full signature).
# V3+ factories share the 9-field event; V2/V4 the 8-field; V1 the 7-field.
contracts:
  - name: PactFactory
    abi_file_path: ./abis/PactFactory.json
    handler: ./src/handlers/PactFactory.ts
    events:
      - event: "PotCreated(address indexed pot, address indexed organizer, address indexed payee, address token, uint256 perPerson, uint256 partySize, uint256 deadline, string title, bool isPrivate)"
        field_selection:
          transaction_fields: [hash]
  - name: PactFactoryV2
    abi_file_path: ./abis/PactFactoryV2.json
    handler: ./src/handlers/PactFactoryV2.ts
    events:
      - event: "PotCreated(address indexed pot, address indexed organizer, address indexed payee, address token, uint256 perPerson, uint256 partySize, uint256 deadline, string title)"
  - name: PactFactoryV1
    abi_file_path: ./abis/PactFactoryV1.json
    handler: ./src/handlers/PactFactoryV1.ts
    events:
      - event: "PotCreated(address indexed pot, address indexed organizer, address indexed payee, address token, uint256 perPerson, uint256 partySize, uint256 deadline)"
  - name: PactPot
    abi_file_path: ./abis/PactPot.json
    handler: ./src/handlers/PactPot.ts
    # No static addresses anywhere — every pot clone registers from PotCreated.
    events:
      - event: "Committed(address indexed pot, address indexed user, uint256 index)"
        field_selection:
          transaction_fields: [hash]
      - event: "Tilted(address indexed pot, uint256 total)"
      - event: "RefundingOpened(address indexed pot)"
      - event: "Refunded(address indexed pot, address indexed user, uint256 amount)"
      - event: "SecretRotated(address indexed pot)"
chains:
  - id: 143 # Monad mainnet
    # Near-head start: backfill covers ~1 day; older pots stay visible via
    # the app's RPC fallback. (A full-history replay over Monad's 100-block
    # RPC ranges takes ~10h and gains nothing — all live pots are new.)
    start_block: 107567192
    rpc:
      url: https://rpc.monad.xyz
      for: sync
    contracts:
      - name: PactFactory
        address:
          - "0x910e17CC1Ea45B824E3Be700430E3F2cD29c5a4E" # v6
          - "0xDFEcE74f0aDBa3cc18B065DBA0DEc82bE52AA830" # v5
          - "0x457ae4d9e8CC1bC6bf3babA9133D1fCe283a9ABE" # v3
      - name: PactFactoryV2
        address:
          - "0x7F50e78b1763c05F944D898EeCC2081c767b2113" # v4
          - "0xEF673BDac2C86506874919b1ad05Bd7D7fa64344" # v2
      - name: PactFactoryV1
        address:
          - "0x6792E51FBD24f9315282BD5b6c5E713dCc779C69" # v1
      - name: PactPot
  - id: 10143 # Monad testnet
    start_block: 65256140
    rpc:
      url: https://testnet-rpc.monad.xyz
      for: sync
    contracts:
      - name: PactFactory
        address:
          - "0x2777C66CDE6C15D301cd0bf03C302b56E298e431" # v6
          - "0xFD842da1854e40c55F19FE63a879CB65cd3B9A28" # v5
          - "0xDFEcE74f0aDBa3cc18B065DBA0DEc82bE52AA830" # v3
      - name: PactFactoryV2
        address:
          - "0x910e17CC1Ea45B824E3Be700430E3F2cD29c5a4E" # v4
          - "0x4f6aD063f1c20D53a4ea4FA1ba46A8783C782D16" # v2
      - name: PactFactoryV1
        address:
          - "0x6792E51FBD24f9315282BD5b6c5E713dCc779C69" # v1
      - name: PactPot
