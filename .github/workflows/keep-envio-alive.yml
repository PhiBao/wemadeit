name: Keep Envio indexer alive

# Envio Cloud shuts a deployment down after 7 days with no API requests
# received. It counts requests to the GraphQL endpoint, NOT onchain activity —
# so indexing a new pot does not register, and a quiet week with no site
# visits can shut the index down mid-judging. This workflow makes a real
# query every 6 hours, giving ~28x margin against the 7-day window.
#
# A 200 is not enough on its own: we ask for rows, so a deployment that is up
# but empty/stale still fails loudly (GitHub emails the repo owner on a failed
# scheduled run).
#
# On indexer redeploy, update ENVIO_URL below to the new deployment id.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # manual run from the Actions tab

permissions: read-all

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENVIO_URL: https://indexer.dev.hyperindex.xyz/c1d7788/v1/graphql
    steps:
      - name: Query the indexer
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 45 --retry 3 --retry-delay 5 \
            -X POST "$ENVIO_URL" \
            -H 'content-type: application/json' \
            -d '{"query":"{Pot(limit:1){address state}}"}')

          echo "response: $response"

          if echo "$response" | grep -q '"errors"'; then
            echo "::error::Indexer returned GraphQL errors — the deployment may be down."
            exit 1
          fi

          rows=$(echo "$response" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("data",{}).get("Pot") or []))')
          echo "Pot rows returned: $rows"

          if [ "$rows" -lt 1 ]; then
            echo "::error::Indexer is reachable but returned no rows. It may have been reset."
            exit 1
          fi

          echo "Indexer healthy."
